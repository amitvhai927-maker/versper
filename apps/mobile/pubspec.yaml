name: vesper_messenger
description: "Vesper Messenger - Enterprise cross-platform client for iOS and Android"
version: 2.4.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.10.8
  web_socket_channel: ^2.4.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  record: ^5.1.2
  audioplayers: ^5.2.1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
